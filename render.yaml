# Blueprint Render — EPSV, variante DÉMO GRATUITE
#
# Architecture (aucun frais, aucun moyen de paiement requis) :
#   - epsv-app : service web Docker (Laravel + nginx + php-fpm), plan gratuit
#   - epsv-db  : PostgreSQL managé Render, plan gratuit
#
# ⚠️ Différences avec la production :
#   - PostgreSQL au lieu de MySQL (l'application est compatible avec les deux ;
#     le serveur de l'école utilisera MySQL comme prévu au cahier des charges).
#   - Le plan gratuit Render met le service en veille après 15 min d'inactivité
#     (premier chargement plus lent) et la base gratuite expire au bout de 30 jours.
#   - Sans disque persistant, les PDF de bulletins archivés sont perdus à chaque
#     redéploiement (ils restent régénérables depuis les notes).
#
# Pour la production : voir render.yaml (MySQL privé + disque persistant) — il
# nécessite l'ajout d'un moyen de paiement au compte Render.

databases:
  - name: epsv-db
    plan: free
    databaseName: epsv
    user: epsv
    postgresMajorVersion: 17

services:
  - type: web
    name: epsv-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "EPSV - Gestion scolaire"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: APP_TIMEZONE
        value: Africa/Brazzaville
      # Générer une clé durable : php artisan key:generate --show
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: epsv-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: epsv-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: epsv-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: epsv-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: epsv-db
          property: password
      # Données de démonstration au premier démarrage
      - key: EPSV_SEED_DEMO
        value: "true"
      - key: EPSV_DEMO_PASSWORD
        generateValue: true
      - key: EPSV_ADMIN_EMAIL
        value: direction@epsv.cg
